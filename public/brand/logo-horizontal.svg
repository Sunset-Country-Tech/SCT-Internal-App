      <stop stop-color="#FFA733"/>
      <stop offset="1" stop-color="#FF5E7D"/>
    </linearGradient>
  </defs>
  <image href="/brand/logo-icon.svg" x="0" y="0" width="128" height="128"/>
  <rect x="150" y="23" width="3" height="82" rx="1.5" fill="url(#divider)"/>
  <text x="178" y="55" fill="#FFFFFF" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="1">SUNSET</text>
  <text x="178" y="84" fill="#FFFFFF" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="1">COUNTRY</text>
  <text x="178" y="112" fill="#FF8A00" font-family="Space Grotesk, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="8">TECH</text>
